<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/Sunny_Favicon.png">
  <title>Observation · Daily Sunwatch</title>
  <meta name="description" content="A permanent Daily Sunwatch solar and space-weather observation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <style>
    .observation-wrap { max-width: 920px; margin: 0 auto; padding: 64px 20px 84px; }
    .back-link { color: var(--muted); text-decoration: none; font-size: .9rem; }
    .back-link:hover { color: var(--yellow); }
    .observation-card { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px; }
    .observation-meta { color: var(--yellow); font-size: .82rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 18px; }
    .observation-text { color: #D0CFC9; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .96rem; line-height: 1.65; }
    .observation-media { display: grid; gap: 12px; margin-bottom: 22px; }
    .observation-media.multi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .observation-media a { display: block; }
    .observation-media img { display: block; width: 100%; border-radius: 9px; border: 1px solid var(--line); background: #0D0D0C; }
    .observation-actions { display: flex; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .post-action-button { display: inline-flex; align-items: center; gap: 5px; padding: 0; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .84rem; font-weight: 600; cursor: pointer; transition: color .15s ease; }
    .post-action-button:hover, .like-button.is-liked, .save-button.is-saved { color: var(--yellow); }
    .post-action-button:disabled { cursor: default; opacity: .7; }
    .post-action-separator { margin: 0 9px; color: var(--line); font-size: .82rem; user-select: none; }
    .auth-control { display: inline-flex; align-items: center; gap: 8px; margin-left: 4px; }
    .auth-button { border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ivory); padding: 7px 10px; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
    .auth-button:hover { color: var(--yellow); border-color: var(--yellow); }
    .auth-user { display: none; align-items: center; gap: 8px; }
    .auth-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .auth-name { color: var(--muted); font-size: .82rem; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { color: var(--muted); }
    @media (max-width: 680px) { .observation-media.multi { grid-template-columns: 1fr; } }
  </style>
</head>
<body id="top">
  <header>
    <div class="wrap nav">
      <a class="brand" href="/">DAILY <span>SUNWATCH</span></a>
      <nav aria-label="Main navigation">
        <a href="/about.html">About</a>
        <a href="/sources.html">Sources</a>
        <a href="/archive.html">Archive</a>
        <a href="/store.html">Store</a>
        <a href="mailto:contact@dailysunwatch.com">Contact</a>
        <span class="auth-control" id="auth-control">
          <button class="auth-button" id="google-sign-in" type="button">Sign in with Google</button>
          <span class="auth-user" id="auth-user">
            <img class="auth-avatar" id="auth-avatar" alt="" referrerpolicy="no-referrer">
            <span class="auth-name" id="auth-name"></span>
            <button class="auth-button" id="google-sign-out" type="button">Sign out</button>
          </span>
        </span>
      </nav>
    </div>
  </header>

  <main class="observation-wrap">
    <a class="back-link" href="/#latest">← Recent observations</a>
    <div id="observation"><p class="status">Loading observation…</p></div>
  </main>

  <footer>
    <div class="wrap">
      <div class="footer-row">
        <div>© 2026 Daily Sunwatch. Clear skies and sunny days. ☀</div>
        <div class="footer-links">
          <a href="#top">Top</a>
          <a href="/privacy.html">Privacy Policy</a>
          <a href="mailto:contact@dailysunwatch.com">contact@dailysunwatch.com</a>
        </div>
      </div>
      <div class="business-info">Daily Sunwatch is a registered assumed business name operated by Nicholas Scatigno in New York.</div>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, getCountFromServer, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCW-BizVPufz9upVEqSyLQLQgxd0w4Wxcs",
      authDomain: "daily-sunwatch.firebaseapp.com",
      projectId: "daily-sunwatch",
      storageBucket: "daily-sunwatch.firebasestorage.app",
      messagingSenderId: "1022960265442",
      appId: "1:1022960265442:web:fd06d76a3216a56bb956bb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    const root = document.getElementById("observation");
    const postId = new URLSearchParams(window.location.search).get("id");
    const signInButton = document.getElementById("google-sign-in");
    const signOutButton = document.getElementById("google-sign-out");
    const userPanel = document.getElementById("auth-user");
    const userName = document.getElementById("auth-name");
    const userAvatar = document.getElementById("auth-avatar");
    let currentPost = null;
    let likeButton = null;
    let saveButton = null;
    let pendingAction = null;

    function formatObservationTitle(post) {
      const title = String(post?.title || post?.type || "Daily Sunwatch").trim();
      const type = String(post?.type || "").trim().toLowerCase();
      if (title === "Moony Moonwatch" || type === "moonwatch") return `Moony Moonwatch 🌙`;
      if (title === "East Coast Weather" || type === "weather") return `🌎 East Coast Weather`;
      if (title === "Coronagraph Watch" || type === "coronagraph_watch") return `🔭 Coronagraph Watch`;
      if (title === "Quiet Corona" || type === "quiet_corona") return `☀️ Quiet Corona`;
      if (title === "Flare Watch" || type === "flare_watch") return `🔥 Flare Watch`;
      if (title === "Coronal Hole Watch" || type === "coronal_hole_watch") return `🕳 Coronal Hole Watch`;
      if (title === "Aurora Watch" || type === "aurora_watch") return `🌌 Aurora Watch`;
      if (title === "Sunny's Lunch Break" || type === "lunch_break") return `🥪 Sunny's Lunch Break`;
      const sunwatchEmoji = {
        "Midnight Sunwatch": "🌙", "Nighttime Sunwatch": "🌕", "Early Morning Sunwatch": "🌅",
        "Morning Sunwatch": "☀️", "Midday Sunwatch": "🌤️", "Afternoon Sunwatch": "☀️", "Evening Sunwatch": "🌇"
      };
      return sunwatchEmoji[title] ? `${sunwatchEmoji[title]} ${title}` : title;
    }

    function likeDocRef(uid) { return doc(db, "posts", postId, "likes", uid); }
    function saveDocRef(uid) { return doc(db, "users", uid, "savedPosts", postId); }

    async function refreshLike() {
      if (!likeButton || !postId) return;
      try {
        const count = (await getCountFromServer(collection(db, "posts", postId, "likes"))).data().count || 0;
        likeButton.querySelector(".like-count").textContent = count;
        const liked = auth.currentUser ? (await getDoc(likeDocRef(auth.currentUser.uid))).exists() : false;
        likeButton.classList.toggle("is-liked", liked);
        likeButton.setAttribute("aria-pressed", liked ? "true" : "false");
        likeButton.querySelector(".like-label").textContent = liked ? "Liked" : "Like";
      } catch (error) { console.error("Could not load Like state:", error); }
    }

    async function refreshSave() {
      if (!saveButton || !postId) return;
      try {
        const saved = auth.currentUser ? (await getDoc(saveDocRef(auth.currentUser.uid))).exists() : false;
        saveButton.classList.toggle("is-saved", saved);
        saveButton.setAttribute("aria-pressed", saved ? "true" : "false");
        saveButton.querySelector(".save-label").textContent = saved ? "Saved" : "Save";
      } catch (error) { console.error("Could not load Save state:", error); }
    }

    async function requireSignIn(action) {
      if (auth.currentUser) return true;
      pendingAction = action;
      try { await signInWithPopup(auth, provider); }
      catch (error) { pendingAction = null; console.error("Google sign-in failed:", error); }
      return false;
    }

    async function toggleLike() {
      if (!(await requireSignIn("like"))) return;
      likeButton.disabled = true;
      try {
        const ref = likeDocRef(auth.currentUser.uid);
        const existing = await getDoc(ref);
        if (existing.exists()) await deleteDoc(ref);
        else await setDoc(ref, { createdAt: serverTimestamp() });
        await refreshLike();
      } catch (error) { console.error("Could not update Like:", error); }
      finally { likeButton.disabled = false; }
    }

    async function toggleSave() {
      if (!(await requireSignIn("save"))) return;
      saveButton.disabled = true;
      try {
        const ref = saveDocRef(auth.currentUser.uid);
        const existing = await getDoc(ref);
        if (existing.exists()) {
          await deleteDoc(ref);
        } else {
          const media = Array.isArray(currentPost?.media)
            ? currentPost.media.filter(item => item && item.url).map(item => ({ type: item.type || "image", url: item.url, alt: item.alt || "" }))
            : [];
          await setDoc(ref, {
            postId,
            title: currentPost?.title || currentPost?.type || "Daily Sunwatch",
            displayText: currentPost?.display_text || currentPost?.text || "",
            publishedDisplay: currentPost?.published_display || "",
            publishedAt: currentPost?.published_at || currentPost?.published_utc || "",
            media,
            savedAt: serverTimestamp()
          });
        }
        await refreshSave();
      } catch (error) { console.error("Could not update Save:", error); }
      finally { saveButton.disabled = false; }
    }

    function shareUrl() { return `${window.location.origin}/observation/?id=${encodeURIComponent(postId)}`; }

    async function copyOrShare(button) {
      const url = shareUrl();
      const title = formatObservationTitle(currentPost || {});
      const text = currentPost?.display_text || currentPost?.text || "";
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
      try {
        if (isMobile && navigator.share) {
          await navigator.share({ title: `${title} — Daily Sunwatch`, text: text.length > 220 ? `${text.slice(0, 217)}...` : text, url });
          return;
        }
        await navigator.clipboard.writeText(url);
        const label = button.querySelector(".share-label");
        label.textContent = "Link copied!";
        setTimeout(() => label.textContent = "Share", 1800);
      } catch (error) { if (error?.name !== "AbortError") console.error("Share failed:", error); }
    }

    async function loadObservation() {
      if (!postId) { root.innerHTML = '<p class="status">No observation was specified.</p>'; return; }
      try {
        const response = await fetch(`/observations/data/${encodeURIComponent(postId)}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        currentPost = await response.json();
        const publicTitle = formatObservationTitle(currentPost);
        document.title = `${publicTitle} · Daily Sunwatch`;

        const card = document.createElement("article");
        card.className = "observation-card";
        const media = Array.isArray(currentPost.media) ? currentPost.media.filter(item => item && item.type === "image" && item.url) : [];
        if (media.length) {
          const gallery = document.createElement("div");
          gallery.className = `observation-media${media.length > 1 ? " multi" : ""}`;
          media.forEach(item => {
            const link = document.createElement("a"); link.href = item.url; link.target = "_blank"; link.rel = "noopener noreferrer";
            const img = document.createElement("img"); img.src = item.url; img.alt = item.alt || "Daily Sunwatch observation";
            link.appendChild(img); gallery.appendChild(link);
          });
          card.appendChild(gallery);
        }

        const meta = document.createElement("div");
        meta.className = "observation-meta";
        meta.textContent = [publicTitle, currentPost.published_display].filter(Boolean).join(" · ");
        const text = document.createElement("div");
        text.className = "observation-text";
        text.textContent = currentPost.display_text || currentPost.text || "";

        const actions = document.createElement("div"); actions.className = "observation-actions";
        likeButton = document.createElement("button"); likeButton.type = "button"; likeButton.className = "post-action-button like-button"; likeButton.setAttribute("aria-pressed", "false");
        likeButton.innerHTML = '<span aria-hidden="true">👍</span> <span class="like-label">Like</span> · <span class="like-count">0</span>';
        const sep1 = document.createElement("span"); sep1.className = "post-action-separator"; sep1.textContent = "·";
        saveButton = document.createElement("button"); saveButton.type = "button"; saveButton.className = "post-action-button save-button"; saveButton.setAttribute("aria-pressed", "false");
        saveButton.innerHTML = '<span aria-hidden="true">⭐</span> <span class="save-label">Save</span>';
        const sep2 = document.createElement("span"); sep2.className = "post-action-separator"; sep2.textContent = "·";
        const shareButton = document.createElement("button"); shareButton.type = "button"; shareButton.className = "post-action-button share-button";
        shareButton.innerHTML = '<span aria-hidden="true">➦</span> <span class="share-label">Share</span>';
        likeButton.addEventListener("click", toggleLike); saveButton.addEventListener("click", toggleSave); shareButton.addEventListener("click", () => copyOrShare(shareButton));
        actions.append(likeButton, sep1, saveButton, sep2, shareButton);
        card.append(meta, text, actions);
        root.replaceChildren(card);
        await Promise.all([refreshLike(), refreshSave()]);
      } catch (error) {
        root.innerHTML = '<p class="status">This observation could not be found in the Daily Sunwatch archive.</p>';
        console.error("Observation load error:", error);
      }
    }

    signInButton.addEventListener("click", async () => { try { await signInWithPopup(auth, provider); } catch (error) { console.error("Google sign-in failed:", error); } });
    signOutButton.addEventListener("click", async () => { try { await signOut(auth); } catch (error) { console.error("Sign-out failed:", error); } });

    onAuthStateChanged(auth, async user => {
      if (user) {
        signInButton.style.display = "none"; userPanel.style.display = "inline-flex"; userName.textContent = user.displayName || user.email || "Signed in";
        if (user.photoURL) { userAvatar.src = user.photoURL; userAvatar.style.display = "block"; } else { userAvatar.removeAttribute("src"); userAvatar.style.display = "none"; }
      } else {
        signInButton.style.display = "inline-block"; userPanel.style.display = "none"; userName.textContent = ""; userAvatar.removeAttribute("src");
      }
      await Promise.all([refreshLike(), refreshSave()]);
      if (user && pendingAction) {
        const action = pendingAction; pendingAction = null;
        if (action === "like") toggleLike();
        if (action === "save") toggleSave();
      }
    });

    loadObservation();
  </script>
</body>
</html>
