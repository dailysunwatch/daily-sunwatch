<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/Sunny_Favicon.png">
  <title>Observation · Daily Sunwatch</title>
  <meta name="description" content="A permanent Daily Sunwatch solar and space-weather observation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <style>
    .observation-wrap { max-width: 920px; margin: 0 auto; padding: 64px 20px 84px; }
    .back-link { color: var(--muted); text-decoration: none; font-size: .9rem; }
    .back-link:hover { color: var(--yellow); }
    .observation-card { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px; }
    .observation-meta { color: var(--yellow); font-size: .82rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 18px; }
    .observation-text { color: #D0CFC9; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .96rem; line-height: 1.65; }
    .observation-media { display: grid; gap: 12px; margin-bottom: 22px; }
    .observation-media.multi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .observation-media a { display: block; }
    .observation-media img { display: block; width: 100%; border-radius: 9px; border: 1px solid var(--line); background: #0D0D0C; }
    .observation-actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line); }
    .share-button { border: 0; padding: 0; background: transparent; color: var(--muted); font: inherit; font-size: .84rem; font-weight: 600; cursor: pointer; }
    .share-button:hover { color: var(--yellow); }
    .status { color: var(--muted); }
    @media (max-width: 680px) { .observation-media.multi { grid-template-columns: 1fr; } }
  </style>
</head>
<body id="top">
  <header>
    <div class="wrap nav">
      <a class="brand" href="/">DAILY <span>SUNWATCH</span></a>
      <nav aria-label="Main navigation">
        <a href="/about.html">About</a>
        <a href="/sources.html">Sources</a>
        <a href="/archive.html">Archive</a>
        <a href="/store.html">Store</a>
        <a href="mailto:contact@dailysunwatch.com">Contact</a>
      </nav>
    </div>
  </header>

  <main class="observation-wrap">
    <a class="back-link" href="/#latest">← Recent observations</a>
    <div id="observation"><p class="status">Loading observation…</p></div>
  </main>

  <footer>
    <div class="wrap">
      <div class="footer-row">
        <div>© 2026 Daily Sunwatch. Clear skies and sunny days. ☀</div>
        <div class="footer-links">
          <a href="#top">Top</a>
          <a href="/privacy.html">Privacy Policy</a>
          <a href="mailto:contact@dailysunwatch.com">contact@dailysunwatch.com</a>
        </div>
      </div>
      <div class="business-info">Daily Sunwatch is a registered assumed business name operated by Nicholas Scatigno in New York.</div>
    </div>
  </footer>

  <script>
    const root = document.getElementById("observation");
    const postId = new URLSearchParams(window.location.search).get("id");

    function shareUrl() {
      return `${window.location.origin}/observation/?id=${encodeURIComponent(postId)}`;
    }

    async function copyOrShare(button, post) {
      const url = shareUrl();
      const isMobile =
        /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));

      try {
        if (isMobile && navigator.share) {
          await navigator.share({
            title: `${post.title || "Observation"} — Daily Sunwatch`,
            text: post.display_text || post.text || "",
            url
          });
          return;
        }
        await navigator.clipboard.writeText(url);
        button.textContent = "➦ Link copied!";
        setTimeout(() => button.textContent = "➦ Share", 1800);
      } catch (error) {
        if (error?.name !== "AbortError") console.error("Share failed:", error);
      }
    }

    async function loadObservation() {
      if (!postId) {
        root.innerHTML = '<p class="status">No observation was specified.</p>';
        return;
      }

      try {
        const response = await fetch(`/observations/data/${encodeURIComponent(postId)}.json`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const post = await response.json();

        document.title = `${post.title || "Observation"} · Daily Sunwatch`;

        const card = document.createElement("article");
        card.className = "observation-card";

        const media = Array.isArray(post.media)
          ? post.media.filter(item => item && item.type === "image" && item.url)
          : [];

        if (media.length) {
          const gallery = document.createElement("div");
          gallery.className = `observation-media${media.length > 1 ? " multi" : ""}`;
          media.forEach(item => {
            const link = document.createElement("a");
            link.href = item.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            const img = document.createElement("img");
            img.src = item.url;
            img.alt = item.alt || "Daily Sunwatch observation";
            link.appendChild(img);
            gallery.appendChild(link);
          });
          card.appendChild(gallery);
        }

        const meta = document.createElement("div");
        meta.className = "observation-meta";
        meta.textContent = [post.title || post.type || "Daily Sunwatch", post.published_display].filter(Boolean).join(" · ");

        const text = document.createElement("div");
        text.className = "observation-text";
        text.textContent = post.display_text || post.text || "";

        const actions = document.createElement("div");
        actions.className = "observation-actions";
        const share = document.createElement("button");
        share.type = "button";
        share.className = "share-button";
        share.textContent = "➦ Share";
        share.addEventListener("click", () => copyOrShare(share, post));
        actions.appendChild(share);

        card.append(meta, text, actions);
        root.replaceChildren(card);
      } catch (error) {
        root.innerHTML = '<p class="status">This observation could not be found in the Daily Sunwatch archive.</p>';
        console.error("Observation load error:", error);
      }
    }

    loadObservation();
  </script>
</body>
</html>
